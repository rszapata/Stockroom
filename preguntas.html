<style>

/* ── Page-specific styles (scoped to .pg) ── */
.pg { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; display: block; color: var(--text); }
.pg *, .pg *::before, .pg *::after { box-sizing: border-box; }

/* page-local css vars */
.pg {
  --bg:var(--bg);--s1:var(--bg-card);--s2:var(--bg-card);--b1:var(--border);--b2:var(--border-2);
  --tx:var(--text);--t2:var(--text-2);--t3:var(--text-3);
  --ye:#FFE600;--cy:#47ffe8;--re:#ff4747;--or:#ff9547;--gr:#47ff8a;
}

/* ── spinner ── */
.pg .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:#FFE600;border-radius:50%;animation:pg-spin .7s linear infinite}
@keyframes pg-spin{to{transform:rotate(360deg)}}
.pg #btn-refresh.is-loading #btn-refresh-icon{animation:pg-spin .7s linear infinite}

/* ── btn ── */
.pg .btn{height:36px;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;border:1px solid var(--b1);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px}
.pg .btn:hover{border-color:var(--b2);color:var(--tx)}
.pg .btn:disabled{opacity:.45;cursor:default}
.pg .btn-ghost{background:transparent;border-color:var(--b1);color:var(--t2)}
.pg .btn-send{background:#22c55e;border-color:#22c55e;color:#000;font-weight:700}
.pg .btn-send:hover{background:#16a34a;border-color:#16a34a;color:#000}
.pg .btn-send:disabled{opacity:.4;cursor:default}

/* ── toolbar ── */
.pg .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:10px 14px;background:var(--s1);border:1px solid var(--b1);border-radius:12px}
.pg .toolbar-left{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.pg .toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pg #hdr-updated{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t3)}

/* ── kpi pill ── */
.pg .kpi-pill{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:14px 20px;min-width:120px}

/* ── account section ── */
.pg .acct-section{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;margin-bottom:20px}
.pg .acct-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1);gap:12px;flex-wrap:wrap}
.pg .acct-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.pg .acct-name{font-size:13px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .acct-meta{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace}

/* ── question card ── */
.pg .q-card{padding:16px 18px;border-bottom:1px solid var(--b1);display:flex;flex-direction:column;gap:12px}
.pg .q-card:last-child{border-bottom:none}
.pg .q-card.answered{opacity:.5;pointer-events:none}
.pg .q-item-row{display:flex;align-items:center;gap:10px}
.pg .q-item-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--b1);background:var(--s2);flex-shrink:0}
.pg .q-item-title{font-size:11px;color:var(--t2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;min-width:0}
.pg .q-text-bubble{background:var(--s2);border:1px solid var(--b1);border-radius:10px;border-top-left-radius:2px;padding:10px 14px;font-size:13px;line-height:1.55;color:var(--tx);position:relative}
.pg .q-text-bubble::before{content:'';position:absolute;left:-6px;top:10px;width:6px;height:10px;background:var(--b1);clip-path:polygon(100% 0,100% 100%,0 50%)}
.pg .q-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:6px}
.pg .q-answer-row{display:flex;flex-direction:column;gap:8px}
.pg .q-textarea{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;color:var(--tx);font-size:13px;font-family:'Inter',sans-serif;padding:10px 14px;resize:vertical;min-height:72px;line-height:1.5;transition:border-color .2s}
.pg .q-textarea:focus{outline:none;border-color:rgba(255,230,0,.4)}
.pg .q-textarea::placeholder{color:var(--t3)}
.pg .q-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pg .char-count{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.pg .char-count.warn{color:var(--or)}
.pg .char-count.error{color:var(--re)}
.pg .q-status{font-size:11px;font-family:'JetBrains Mono',monospace;min-height:16px}
.pg .q-status.ok{color:var(--gr)}
.pg .q-status.err{color:var(--re)}

/* ── quick replies ── */
.pg .quick-replies{display:flex;flex-wrap:wrap;gap:6px}
.pg .quick-btn{height:26px;padding:0 10px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;border:1px solid var(--b1);background:transparent;color:var(--t2);border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pg .quick-btn:hover{border-color:rgba(255,230,0,.3);color:var(--ye);background:rgba(255,230,0,.05)}

/* ── empty / error ── */
.pg .empty-row{padding:32px 18px;text-align:center;color:var(--t3);font-size:12px}
.pg .error-row{padding:16px 18px;color:var(--re);font-size:12px;font-family:'JetBrains Mono',monospace}

/* ── status bar ── */
.pg .status-bar{min-height:22px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2);margin-bottom:20px}

/* ── kpi row ── */
.pg .kpi-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}

@media(max-width:640px){
  .pg .kpi-row{flex-wrap:wrap}
  .pg .quick-replies{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .pg .quick-btn{flex-shrink:0}
  .pg .q-textarea{min-height:60px}
}

</style>
</head>

  <!-- CONTENT -->

  <!-- Toolbar (replaces old header buttons) -->

<script>
/* ─── Shell bootstrap (inline) ─── */
const $I = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Clock */
(function clock(){
  const el = $I('foot-clock');
  if(!el) return;
  const tick = () => { el.textContent = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
  tick(); setInterval(tick, 1000);
})();

/* Hamburger */
(function(){
  const btn = $I('btn-hamburger');
  const sb  = $I('sidebar');
  const ov  = $I('sidebar-overlay');
  if(!btn||!sb) return;
  btn.addEventListener('click', () => { sb.classList.toggle('open'); if(ov) ov.classList.toggle('open'); });
  if(ov) ov.addEventListener('click', () => { sb.classList.remove('open'); ov.classList.remove('open'); });
})();

/* Theme toggle */
(function(){
  const btn = $I('btn-theme');
  if(!btn) return;
  const apply = t => { document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('adminTheme',t); }catch(e){} };
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')||'light';
    apply(cur === 'dark' ? 'light' : 'dark');
  });
})();

/* Account switcher */
async function loadAccounts(){
  try {
    const r = await fetch('/accounts');
    const d = await r.json();
    const list = Array.isArray(d) ? d : (d.accounts||[]);
    const active = list.find(a=>a.active) || list[0];
    if(active){
      const init = $I('acc-initial'); const lbl = $I('acc-label');
      const act = $I('acc-active'); const actId = $I('acc-active-id');
      if(init) init.textContent = (active.label||'?').charAt(0).toUpperCase();
      if(lbl)  lbl.textContent  = active.label||active.accountId||'Cuenta';
      if(act)  act.textContent  = active.label||active.accountId||'—';
      if(actId)actId.textContent= active.accountId||'—';
    }
    const panel = $I('acc-list');
    if(panel){
      panel.innerHTML = list.map(a=>`
        <button onclick="switchAcctShell('${esc(a.accountId)}')" class="adm-dropdown-item${a.active?' active':''}">
          <div class="adm-avatar" style="width:26px;height:26px;font-size:11px">${(a.label||'?').charAt(0).toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;color:var(--text)">${esc(a.label||a.accountId)}</div>
            <div style="font-size:11px;color:var(--text-3);font-family:var(--font-mono)">${esc(a.accountId)}</div>
          </div>
          ${a.active?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
        </button>`).join('');
    }
  } catch(e) { console.warn('loadAccounts:', e); }
}
async function switchAcctShell(id){
  try{ await fetch('/switch-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accountId:id})}); location.reload(); }catch(e){}
}
const accBtn = $I('acc-btn');
const accPanel = $I('acc-panel');
if(accBtn && accPanel){
  accBtn.addEventListener('click', e => { e.stopPropagation(); accPanel.classList.toggle('hidden'); });
  document.addEventListener('click', () => { if(accPanel) accPanel.classList.add('hidden'); });
}
loadAccounts();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

/* ─── Page-specific JS ─── */

// ── Quick replies predefinidos ─────────────────────────────────
const QUICK_REPLIES = [
  '¡Hola! Sí, está disponible. ¿Lo querés con envío a domicilio?',
  'Hola, el producto está en stock y tiene envío inmediato.',
  '¡Hola! Los enviamos a todo el país por MercadoEnvíos.',
  'Hola, el envío demora entre 24 y 72 hs hábiles dependiendo de tu ubicación.',
  'Hola, es compatible. Indicame el modelo de tu dispositivo y te confirmo.',
  'Hola, el producto incluye garantía. Ante cualquier inconveniente lo resolvemos.',
];

// ── Estado ─────────────────────────────────────────────────────
let lastData = null;

// ── Helpers ────────────────────────────────────────────────────
function fmtNow() {
  return new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const hoy = new Date();
  const esHoy = d.toDateString() === hoy.toDateString();
  if (esHoy) return d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }) + ' ' +
         d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function setStatus(msg, loading=false) {
  $I('status-bar').innerHTML = (loading ? '<span class="spinner" style="margin-right:8px"></span>' : '') + msg;
}

// ── Render ─────────────────────────────────────────────────────
function renderData(d, ts) {
  lastData = d;
  $I('kpi-total').textContent  = d.total;
  const timeStr = ts ? new Date(ts).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }) : fmtNow();
  $I('kpi-updated').textContent = timeStr;
  $I('hdr-updated').textContent = 'Última carga: ' + timeStr;

  const container = $I('accounts-container');
  container.innerHTML = '';

  for (const acct of d.accounts) {
    const section = document.createElement('div');
    section.className = 'acct-section';
    section.id = `acct-${CSS.escape(acct.accountId)}`;

    const count = acct.questions?.length || 0;
    section.innerHTML = `
      <div class="acct-header">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="acct-avatar">${esc((acct.label||'?').trim().charAt(0).toUpperCase())}</div>
          <div style="min-width:0">
            <div class="acct-name">${esc(acct.label || acct.accountId)}</div>
            <div class="acct-meta">${acct.ok
              ? (count ? `${count} pregunta${count!==1?'s':''} sin responder` : '✓ Sin preguntas pendientes')
              : `<span style="color:var(--re)">Error: ${esc(acct.error||'')}</span>`}
            </div>
          </div>
        </div>
      </div>
      <div class="questions-list" id="qlist-${esc(acct.accountId)}">
        ${renderQuestions(acct)}
      </div>`;
    container.appendChild(section);
  }

  if (!d.total) {
    setStatus('✓ Sin preguntas pendientes en ninguna cuenta.');
  } else {
    const errCount = d.accounts.filter(a => !a.ok).length;
    setStatus(errCount
      ? `⚠ ${errCount} cuenta(s) con error · ${d.total} preguntas sin responder`
      : `${d.total} pregunta${d.total!==1?'s':''} sin responder`);
  }
}

function renderQuestions(acct) {
  if (!acct.ok) return `<div class="error-row">❌ ${esc(acct.error || 'Error al cargar')}</div>`;
  if (!acct.questions.length) return '<div class="empty-row">✓ Sin preguntas pendientes</div>';

  return acct.questions.map(q => `
    <div class="q-card" id="qcard-${q.id}" data-qid="${q.id}" data-acct="${esc(acct.accountId)}">

      <!-- Item info -->
      <div class="q-item-row">
        ${q.item_thumb
          ? `<img src="${esc(q.item_thumb)}" alt="" class="q-item-thumb" loading="lazy"/>`
          : `<div class="q-item-thumb"></div>`}
        <div class="q-item-title">${esc(q.item_title)}</div>
        <a href="https://www.mercadolibre.com.ar/p/${esc(q.item_id)}" target="_blank" rel="noopener"
           style="flex-shrink:0;color:var(--t3);transition:color .15s;display:flex;align-items:center" onmouseover="this.style.color='var(--ye)'" onmouseout="this.style.color='var(--t3)'"
           title="Ver publicación">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>

      <!-- Burbuja de pregunta -->
      <div>
        <div class="q-text-bubble">${esc(q.text)}</div>
        <div class="q-meta">
          <svg viewBox="0 0 24 24" fill="none" width="11" height="11" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.2 21a7 7 0 0113.6 0"/></svg>
          ${q.buyer_id ? `ID ${q.buyer_id}` : 'Comprador'}
          <span>·</span>
          <svg viewBox="0 0 24 24" fill="none" width="11" height="11" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${fmtDate(q.date_created)}
        </div>
      </div>

      <!-- Quick replies -->
      <div class="quick-replies">
        ${QUICK_REPLIES.map((r,i) => `
          <button class="quick-btn" onclick="fillQuick(${q.id},'${r.replace(/'/g,"\\'")}')">
            ${esc(r.length > 38 ? r.slice(0, 36) + '…' : r)}
          </button>`).join('')}
      </div>

      <!-- Textarea + enviar -->
      <div class="q-answer-row">
        <textarea
          class="q-textarea"
          id="ta-${q.id}"
          placeholder="Escribí tu respuesta…"
          maxlength="2000"
          oninput="updateCharCount(${q.id})"
          onkeydown="handleKey(event,${q.id},'${esc(acct.accountId)}')"
        ></textarea>
        <div class="q-footer">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="char-count" id="cc-${q.id}">0 / 2000</span>
            <span class="q-status" id="qs-${q.id}"></span>
          </div>
          <button class="btn btn-send" id="sb-${q.id}"
            onclick="responder(${q.id},'${esc(acct.accountId)}')"
            disabled>
            <svg viewBox="0 0 24 24" fill="none" width="13" height="13" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Responder
          </button>
        </div>
      </div>

    </div>
  `).join('');
}

// ── Lógica de respuesta ────────────────────────────────────────
function fillQuick(qid, text) {
  const ta = $I(`ta-${qid}`);
  if (!ta) return;
  ta.value = text;
  ta.focus();
  ta.setSelectionRange(text.length, text.length);
  updateCharCount(qid);
}

function updateCharCount(qid) {
  const ta = $I(`ta-${qid}`);
  const cc = $I(`cc-${qid}`);
  const sb = $I(`sb-${qid}`);
  if (!ta) return;
  const len = ta.value.length;
  cc.textContent = `${len} / 2000`;
  cc.className = 'char-count' + (len > 1900 ? ' error' : len > 1600 ? ' warn' : '');
  if (sb) sb.disabled = len === 0;
}

function handleKey(e, qid, accountId) {
  // Ctrl+Enter o Cmd+Enter para enviar
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    responder(qid, accountId);
  }
}

async function responder(qid, accountId) {
  const ta  = $I(`ta-${qid}`);
  const sb  = $I(`sb-${qid}`);
  const qs  = $I(`qs-${qid}`);
  const text = ta?.value?.trim();
  if (!text) return;

  sb.disabled = true;
  sb.innerHTML = '<span class="spinner"></span>';
  qs.textContent = '';
  qs.className = 'q-status';

  try {
    const r = await fetch('/preguntas-responder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accountId, question_id: qid, text }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error desconocido');

    // Éxito: marcar card como respondida y ocultarla con animación
    qs.textContent = '✓ Enviada';
    qs.className = 'q-status ok';

    const card = $I(`qcard-${qid}`);
    if (card) {
      card.classList.add('answered');
      setTimeout(() => {
        card.style.transition = 'max-height .4s ease, opacity .4s ease, padding .4s ease';
        card.style.maxHeight = card.scrollHeight + 'px';
        requestAnimationFrame(() => {
          card.style.maxHeight = '0';
          card.style.opacity = '0';
          card.style.padding = '0';
          card.style.overflow = 'hidden';
        });
        setTimeout(() => {
          card.remove();
          actualizarContadorCuenta(accountId);
        }, 420);
      }, 600);
    }
  } catch(e) {
    qs.textContent = '✗ ' + e.message;
    qs.className = 'q-status err';
    sb.disabled = false;
    sb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" width="13" height="13" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Responder';
  }
}

function actualizarContadorCuenta(accountId) {
  // Contar cards restantes en la sección
  const list = $I(`qlist-${accountId}`);
  if (!list) return;
  const remaining = list.querySelectorAll('.q-card').length;

  // Actualizar KPI global
  const kpi = $I('kpi-total');
  const prev = parseInt(kpi.textContent) || 0;
  kpi.textContent = Math.max(0, prev - 1);

  // Actualizar meta de cuenta
  const acctSection = document.getElementById(`acct-${CSS.escape(accountId)}`);
  if (acctSection) {
    const meta = acctSection.querySelector('.acct-meta');
    if (meta) meta.textContent = remaining
      ? `${remaining} pregunta${remaining!==1?'s':''} sin responder`
      : '✓ Sin preguntas pendientes';
  }

  if (!remaining) {
    list.innerHTML = '<div class="empty-row">✓ Sin preguntas pendientes</div>';
  }
}

// ── caché local ───────────────────────────────────────────────
const CACHE_KEY = 'stockroom_preguntas_v1';
function saveCache(d) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ d, ts: new Date().toISOString() })); } catch(e) {}
}
function loadFromCache() {
  try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; }
}

// ── Carga de datos ─────────────────────────────────────────────
async function load() {
  const btn = $I('btn-refresh');
  btn.disabled = true;
  btn.classList.add('is-loading');
  try {
    const r = await fetch('/preguntas-all');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    saveCache(d);
    renderData(d, new Date().toISOString());
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('is-loading');
  }
}

// Al abrir la página: mostrar caché si existe, sin llamar a la API
(function initFromCache() {
  const cached = loadFromCache();
  if (cached) {
    renderData(cached.d, cached.ts);
  } else {
    setStatus('Presioná Actualizar para cargar las preguntas.');
  }
})();
</script>
