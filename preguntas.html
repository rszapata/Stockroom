<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'], mono: ['JetBrains Mono','ui-monospace','monospace'] },
        colors: { brand: { DEFAULT:'#FFE600', 300:'#FFE82E', 400:'#FFE600', 500:'#E6CF00' } },
        boxShadow: { pop: '0 10px 30px -10px rgb(0 0 0 / 0.6)' },
      }
    }
  }
</script>
<style>
:root{--bg:#0c0c0e;--s1:#141416;--s2:#1c1c20;--b1:#2a2a30;--b2:#3a3a42;--tx:#e8e8f0;--t2:#8888a0;--t3:#55556a;--ye:#FFE600;--cy:#47ffe8;--re:#ff4747;--or:#ff9547;--gr:#47ff8a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 10%,rgba(255,230,0,.04) 0%,transparent 40%),radial-gradient(circle at 80% 90%,rgba(120,180,255,.03) 0%,transparent 40%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.side-item{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#71717a;transition:background .2s,color .2s;text-decoration:none;cursor:pointer;border:none;background:transparent}
.side-item:hover{background:#171717;color:#e4e4e7}
.side-item.active{background:#1a1a1a;color:#FFE600}
.side-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:#FFE600;border-radius:2px}
.side-item .tip{position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#171717;color:#e4e4e7;font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid #262626;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;letter-spacing:.02em;z-index:60}
.side-item:hover .tip{opacity:1;transform:translateY(-50%) translateX(4px)}
.pulse-dot{position:relative;width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0}
.pulse-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:#22c55e;opacity:.35;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.8);opacity:0}}
html,body,input,select,textarea,button{accent-color:#FFE600;color-scheme:dark}
::selection{background:rgba(255,230,0,.35);color:#fff}
*:focus-visible{outline:1px solid #FFE600;outline-offset:2px}

/* ── spinner ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:#FFE600;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── btn ── */
.btn{height:36px;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;border:1px solid var(--b1);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px}
.btn:hover{border-color:var(--b2);color:var(--tx)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--ye);color:#0c0c0e;border-color:var(--ye);font-weight:700}
.btn-primary:hover{background:#f5dc00;border-color:#f5dc00;color:#0c0c0e}
.btn-ghost{background:transparent;border-color:var(--b1);color:var(--t2)}
.btn-send{background:#22c55e;border-color:#22c55e;color:#000;font-weight:700}
.btn-send:hover{background:#16a34a;border-color:#16a34a;color:#000}
.btn-send:disabled{opacity:.4;cursor:default}

/* ── kpi pill ── */
.kpi-pill{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:14px 20px;min-width:120px}

/* ── account section ── */
.acct-section{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;margin-bottom:20px}
.acct-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1);gap:12px;flex-wrap:wrap}
.acct-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FFE600,#E6CF00);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0c0c0e;flex-shrink:0}
.acct-name{font-size:13px;font-weight:600;color:var(--tx)}
.acct-meta{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace}

/* ── question card ── */
.q-card{padding:16px 18px;border-bottom:1px solid var(--b1);display:flex;flex-direction:column;gap:12px}
.q-card:last-child{border-bottom:none}
.q-card.answered{opacity:.5;pointer-events:none}
.q-item-row{display:flex;align-items:center;gap:10px}
.q-item-thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--b1);background:var(--s2);flex-shrink:0}
.q-item-title{font-size:11px;color:var(--t2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q-text-bubble{background:var(--s2);border:1px solid var(--b1);border-radius:10px;border-top-left-radius:2px;padding:10px 14px;font-size:13px;line-height:1.55;color:var(--tx);position:relative}
.q-text-bubble::before{content:'';position:absolute;left:-6px;top:10px;width:6px;height:10px;background:var(--b1);clip-path:polygon(100% 0,100% 100%,0 50%)}
.q-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.q-answer-row{display:flex;flex-direction:column;gap:8px}
.q-textarea{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;color:var(--tx);font-size:13px;font-family:'Inter',sans-serif;padding:10px 14px;resize:vertical;min-height:72px;line-height:1.5;transition:border-color .2s}
.q-textarea:focus{outline:none;border-color:rgba(255,230,0,.4)}
.q-textarea::placeholder{color:var(--t3)}
.q-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.char-count{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.char-count.warn{color:var(--or)}
.char-count.error{color:var(--re)}
.q-status{font-size:11px;font-family:'JetBrains Mono',monospace;min-height:16px}
.q-status.ok{color:var(--gr)}
.q-status.err{color:var(--re)}

/* ── quick replies ── */
.quick-replies{display:flex;flex-wrap:wrap;gap:6px}
.quick-btn{height:26px;padding:0 10px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;border:1px solid var(--b1);background:transparent;color:var(--t2);border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap}
.quick-btn:hover{border-color:rgba(255,230,0,.3);color:var(--ye);background:rgba(255,230,0,.05)}

/* ── empty / error ── */
.empty-row{padding:32px 18px;text-align:center;color:var(--t3);font-size:12px}
.error-row{padding:16px 18px;color:var(--re);font-size:12px;font-family:'JetBrains Mono',monospace}

/* ── status bar ── */
.status-bar{min-height:22px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2)}

@media(max-width:640px){.kpi-row{flex-wrap:wrap}}
</style>
</head>

<div class="pl-16 min-h-screen relative z-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-neutral-950/80 backdrop-blur-xl border-b border-neutral-800">

<script>
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

// ── Quick replies predefinidos ─────────────────────────────────
const QUICK_REPLIES = [
  '¡Hola! Sí, está disponible. ¿Lo querés con envío a domicilio?',
  'Hola, el producto está en stock y tiene envío inmediato.',
  '¡Hola! Los enviamos a todo el país por MercadoEnvíos.',
  'Hola, el envío demora entre 24 y 72 hs hábiles dependiendo de tu ubicación.',
  'Hola, es compatible. Indicame el modelo de tu dispositivo y te confirmo.',
  'Hola, el producto incluye garantía. Ante cualquier inconveniente lo resolvemos.',
];

// ── Estado ─────────────────────────────────────────────────────
let lastData = null;

// ── Helpers ────────────────────────────────────────────────────
function fmtNow() {
  return new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const hoy = new Date();
  const esHoy = d.toDateString() === hoy.toDateString();
  if (esHoy) return d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' }) + ' ' +
         d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function setStatus(msg, loading=false) {
  $('status-bar').innerHTML = (loading ? '<span class="spinner mr-2"></span>' : '') + msg;
}

// ── Render ─────────────────────────────────────────────────────
function renderData(d) {
  lastData = d;
  $('kpi-total').textContent  = d.total;
  $('kpi-updated').textContent = fmtNow();

  const container = $('accounts-container');
  container.innerHTML = '';

  for (const acct of d.accounts) {
    const section = document.createElement('div');
    section.className = 'acct-section';
    section.id = `acct-${CSS.escape(acct.accountId)}`;

    const count = acct.questions?.length || 0;
    section.innerHTML = `
      <div class="acct-header">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="acct-avatar">${esc((acct.label||'?').trim().charAt(0).toUpperCase())}</div>
          <div class="min-w-0">
            <div class="acct-name truncate">${esc(acct.label || acct.accountId)}</div>
            <div class="acct-meta">${acct.ok
              ? (count ? `${count} pregunta${count!==1?'s':''} sin responder` : '✓ Sin preguntas pendientes')
              : `<span style="color:var(--re)">Error: ${esc(acct.error||'')}</span>`}
            </div>
          </div>
        </div>
      </div>
      <div class="questions-list" id="qlist-${esc(acct.accountId)}">
        ${renderQuestions(acct)}
      </div>`;
    container.appendChild(section);
  }

  if (!d.total) {
    setStatus('✓ Sin preguntas pendientes en ninguna cuenta.');
  } else {
    const errCount = d.accounts.filter(a => !a.ok).length;
    setStatus(errCount
      ? `⚠ ${errCount} cuenta(s) con error · ${d.total} preguntas sin responder`
      : `${d.total} pregunta${d.total!==1?'s':''} sin responder`);
  }
}

function renderQuestions(acct) {
  if (!acct.ok) return `<div class="error-row">❌ ${esc(acct.error || 'Error al cargar')}</div>`;
  if (!acct.questions.length) return '<div class="empty-row">✓ Sin preguntas pendientes</div>';

  return acct.questions.map(q => `
    <div class="q-card" id="qcard-${q.id}" data-qid="${q.id}" data-acct="${esc(acct.accountId)}">

      <!-- Item info -->
      <div class="q-item-row">
        ${q.item_thumb
          ? `<img src="${esc(q.item_thumb)}" alt="" class="q-item-thumb" loading="lazy"/>`
          : `<div class="q-item-thumb"></div>`}
        <div class="q-item-title">${esc(q.item_title)}</div>
        <a href="https://www.mercadolibre.com.ar/p/${esc(q.item_id)}" target="_blank" rel="noopener"
           style="flex-shrink:0;color:var(--t3);transition:color .15s" onmouseover="this.style.color='var(--ye)'" onmouseout="this.style.color='var(--t3)'"
           title="Ver publicación">
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>

      <!-- Burbuja de pregunta -->
      <div>
        <div class="q-text-bubble">${esc(q.text)}</div>
        <div class="q-meta" style="margin-top:6px">
          <svg viewBox="0 0 24 24" fill="none" width="11" height="11" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.2 21a7 7 0 0113.6 0"/></svg>
          ${q.buyer_id ? `ID ${q.buyer_id}` : 'Comprador'}
          <span>·</span>
          <svg viewBox="0 0 24 24" fill="none" width="11" height="11" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${fmtDate(q.date_created)}
        </div>
      </div>

      <!-- Quick replies -->
      <div class="quick-replies">
        ${QUICK_REPLIES.map((r,i) => `
          <button class="quick-btn" onclick="fillQuick(${q.id},'${r.replace(/'/g,"\\'")}')">
            ${esc(r.length > 38 ? r.slice(0, 36) + '…' : r)}
          </button>`).join('')}
      </div>

      <!-- Textarea + enviar -->
      <div class="q-answer-row">
        <textarea
          class="q-textarea"
          id="ta-${q.id}"
          placeholder="Escribí tu respuesta…"
          maxlength="2000"
          oninput="updateCharCount(${q.id})"
          onkeydown="handleKey(event,${q.id},'${esc(acct.accountId)}')"
        ></textarea>
        <div class="q-footer">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="char-count" id="cc-${q.id}">0 / 2000</span>
            <span class="q-status" id="qs-${q.id}"></span>
          </div>
          <button class="btn btn-send" id="sb-${q.id}"
            onclick="responder(${q.id},'${esc(acct.accountId)}')"
            disabled>
            <svg viewBox="0 0 24 24" fill="none" width="13" height="13" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Responder
          </button>
        </div>
      </div>

    </div>
  `).join('');
}

// ── Lógica de respuesta ────────────────────────────────────────
function fillQuick(qid, text) {
  const ta = $(`ta-${qid}`);
  if (!ta) return;
  ta.value = text;
  ta.focus();
  ta.setSelectionRange(text.length, text.length);
  updateCharCount(qid);
}

function updateCharCount(qid) {
  const ta = $(`ta-${qid}`);
  const cc = $(`cc-${qid}`);
  const sb = $(`sb-${qid}`);
  if (!ta) return;
  const len = ta.value.length;
  cc.textContent = `${len} / 2000`;
  cc.className = 'char-count' + (len > 1900 ? ' error' : len > 1600 ? ' warn' : '');
  if (sb) sb.disabled = len === 0;
}

function handleKey(e, qid, accountId) {
  // Ctrl+Enter o Cmd+Enter para enviar
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    responder(qid, accountId);
  }
}

async function responder(qid, accountId) {
  const ta  = $(`ta-${qid}`);
  const sb  = $(`sb-${qid}`);
  const qs  = $(`qs-${qid}`);
  const text = ta?.value?.trim();
  if (!text) return;

  sb.disabled = true;
  sb.innerHTML = '<span class="spinner"></span>';
  qs.textContent = '';
  qs.className = 'q-status';

  try {
    const r = await fetch('/preguntas-responder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accountId, question_id: qid, text }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error desconocido');

    // Éxito: marcar card como respondida y ocultarla con animación
    qs.textContent = '✓ Enviada';
    qs.className = 'q-status ok';

    const card = $(`qcard-${qid}`);
    if (card) {
      card.classList.add('answered');
      setTimeout(() => {
        card.style.transition = 'max-height .4s ease, opacity .4s ease, padding .4s ease';
        card.style.maxHeight = card.scrollHeight + 'px';
        requestAnimationFrame(() => {
          card.style.maxHeight = '0';
          card.style.opacity = '0';
          card.style.padding = '0';
          card.style.overflow = 'hidden';
        });
        setTimeout(() => {
          card.remove();
          actualizarContadorCuenta(accountId);
        }, 420);
      }, 600);
    }
  } catch(e) {
    qs.textContent = '✗ ' + e.message;
    qs.className = 'q-status err';
    sb.disabled = false;
    sb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" width="13" height="13" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Responder';
  }
}

function actualizarContadorCuenta(accountId) {
  // Contar cards restantes en la sección
  const list = $(`qlist-${accountId}`);
  if (!list) return;
  const remaining = list.querySelectorAll('.q-card').length;

  // Actualizar KPI global
  const kpi = $('kpi-total');
  const prev = parseInt(kpi.textContent) || 0;
  kpi.textContent = Math.max(0, prev - 1);

  // Actualizar meta de cuenta
  const acctSection = document.getElementById(`acct-${CSS.escape(accountId)}`);
  if (acctSection) {
    const meta = acctSection.querySelector('.acct-meta');
    if (meta) meta.textContent = remaining
      ? `${remaining} pregunta${remaining!==1?'s':''} sin responder`
      : '✓ Sin preguntas pendientes';
  }

  if (!remaining) {
    list.innerHTML = '<div class="empty-row">✓ Sin preguntas pendientes</div>';
  }
}

// ── Carga de datos ─────────────────────────────────────────────
async function load() {
  $('btn-refresh').disabled = true;
  setStatus('Cargando preguntas de todas las cuentas…', true);
  try {
    const r = await fetch('/preguntas-all');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    renderData(d);
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
  $('btn-refresh').disabled = false;
}

// ── Auto-refresh cada 3 min ────────────────────────────────────
load();
setInterval(load, 180_000);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
