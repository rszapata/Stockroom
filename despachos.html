<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0c0e">
<link rel="manifest" href="/manifest.webmanifest">

<title>DESPACHOS — STOCKROOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'], mono: ['JetBrains Mono','ui-monospace','monospace'] },
        colors: { brand: { DEFAULT:'#FFE600', 300:'#FFE82E', 400:'#FFE600', 500:'#E6CF00' } },
        boxShadow: { pop: '0 10px 30px -10px rgb(0 0 0 / 0.6)' },
      }
    }
  }
</script>
<style>
:root{--bg:#0c0c0e;--s1:#141416;--s2:#1c1c20;--b1:#2a2a30;--b2:#3a3a42;--tx:#e8e8f0;--t2:#8888a0;--t3:#55556a;--ye:#FFE600;--cy:#47ffe8;--re:#ff4747;--or:#ff9547;--gr:#47ff8a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 10%,rgba(255,230,0,.04) 0%,transparent 40%),radial-gradient(circle at 80% 90%,rgba(120,180,255,.03) 0%,transparent 40%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.side-item{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#71717a;transition:background .2s,color .2s;text-decoration:none;cursor:pointer;border:none;background:transparent}
.side-item:hover{background:#171717;color:#e4e4e7}
.side-item.active{background:#1a1a1a;color:#FFE600}
.side-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:#FFE600;border-radius:2px}
.side-item .tip{position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#171717;color:#e4e4e7;font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid #262626;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;letter-spacing:.02em;z-index:60}
.side-item:hover .tip{opacity:1;transform:translateY(-50%) translateX(4px)}
.pulse-dot{position:relative;width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0}
.pulse-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:#22c55e;opacity:.35;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.drp-panel{transform-origin:top right;animation:pop .18s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
html,body,input,select,textarea,button{accent-color:#FFE600;color-scheme:dark}
::selection{background:rgba(255,230,0,.35);color:#fff}
*:focus-visible{outline:1px solid #FFE600;outline-offset:2px}

/* ── spinner ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:#FFE600;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── btn ── */
.btn{height:36px;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;border:1px solid var(--b1);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px}
.btn:hover{border-color:var(--b2);color:var(--tx)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--ye);color:#0c0c0e;border-color:var(--ye);font-weight:700}
.btn-primary:hover{background:#d4eb3a;border-color:#d4eb3a}
.btn-ghost{background:transparent;border-color:var(--b1);color:var(--t2)}
.btn-zpl{background:#6366f1;border-color:#6366f1;color:#fff;font-weight:700}
.btn-zpl:hover{background:#4f46e5;border-color:#4f46e5}

/* ── kpi pill ── */
.kpi-pill{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:14px 20px;min-width:120px}

/* ── account section ── */
.acct-section{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;margin-bottom:20px}
.acct-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1);gap:12px;flex-wrap:wrap}
.acct-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FFE600,#E6CF00);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0c0c0e;flex-shrink:0}
.acct-name{font-size:13px;font-weight:600;color:var(--tx)}
.acct-meta{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace}

/* ── order card ── */
.order-row{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--b1);transition:background .12s}
.order-row:last-child{border-bottom:none}
.order-row:hover{background:rgba(255,255,255,.025)}
.item-img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--b1);flex-shrink:0;background:var(--s2)}
.item-title{font-size:12px;color:var(--tx);font-weight:500;line-height:1.4}
.item-variant{font-size:11px;color:var(--t2);margin-top:2px}
.qty-badge{height:24px;min-width:28px;padding:0 8px;background:rgba(255,230,0,.1);border:1px solid rgba(255,230,0,.25);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ye);display:inline-flex;align-items:center;justify-content:center}
.flex-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:rgba(71,255,232,.1);border:1px solid rgba(71,255,232,.3);color:var(--cy);letter-spacing:.06em;font-weight:600}
.correo-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.05);border:1px solid var(--b2);color:var(--t2);letter-spacing:.06em}
.error-row{padding:16px 18px;color:var(--re);font-size:12px;font-family:'JetBrains Mono',monospace}
.empty-row{padding:24px 18px;text-align:center;color:var(--t3);font-size:12px}

/* ── status bar ── */
.status-bar{min-height:22px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2)}

@media(max-width:640px){
  .btn-group{flex-wrap:wrap}
  .kpi-row{flex-wrap:wrap}
}
</style>
</head>

<!-- ────────────────────────────────── MAIN ──── -->
<div class="pl-16 min-h-screen relative z-10">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-neutral-950/80 backdrop-blur-xl border-b border-neutral-800">
    <div class="flex items-center justify-between px-8 py-4 gap-4">
      <div class="min-w-0">
        <h1 class="text-xl font-semibold tracking-tight text-neutral-100">Despachos</h1>
        <p class="text-xs text-neutral-500 mt-0.5 flex items-center gap-2">
          <span class="pulse-dot"></span>
          <span id="hdr-sub">Todas las cuentas · pedidos para despachar hoy</span>
        </p>
      </div>

        <button onclick="load()" class="btn btn-ghost" id="btn-refresh" title="Actualizar">

          Actualizar
        </button>
        <button onclick="generar('pdf')" class="btn btn-primary" id="btn-pdf" disabled>
          ↓ PDF Flex · todas
        </button>
        <button onclick="generar('zpl2')" class="btn btn-zpl" id="btn-zpl" disabled>
          🖨 ZPL · todas
        </button>
      </div>
    </div>
  </header>

  <main class="px-8 py-7 max-w-5xl mx-auto">

    <!-- KPI row -->
    <div class="flex gap-4 mb-7 kpi-row">

        <div class="text-[10px] font-mono uppercase tracking-widest text-neutral-500 mb-1">Órdenes</div>
        <div class="text-2xl font-bold font-mono text-neutral-100" id="kpi-orders">—</div>
      </div>
      <div class="kpi-pill">
        <div class="text-[10px] font-mono uppercase tracking-widest text-neutral-500 mb-1">Unidades</div>
        <div class="text-2xl font-bold font-mono text-neutral-100" id="kpi-units">—</div>
      </div>
      <div class="kpi-pill">
        <div class="text-[10px] font-mono uppercase tracking-widest text-neutral-500 mb-1">Flex</div>
        <div class="text-2xl font-bold font-mono" id="kpi-flex" style="color:var(--cy)">—</div>

<script>
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

// ── state ──────────────────────────────────────────────────────
let lastData = null;

// ── helpers ────────────────────────────────────────────────────
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}
function fmtNow() {
  return new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function setStatus(msg, loading=false) {
  $('status-bar').innerHTML = (loading ? '<span class="spinner mr-2"></span>' : '') + msg;
}

// ── render ─────────────────────────────────────────────────────
function renderData(d) {
  lastData = d;

  // KPIs globales
  $('kpi-orders').textContent = d.totalOrders;
  $('kpi-units').textContent  = d.totalUnits;
  const allOrders = d.accounts.flatMap(a => a.orders || []);
  const flexCount   = allOrders.filter(o => o.is_flex).length;
  const correoCount = allOrders.filter(o => !o.is_flex).length;
  $('kpi-flex').textContent   = flexCount;
  $('kpi-correo').textContent = correoCount;
  $('kpi-updated').textContent = fmtNow();

  // Botones globales
  $('btn-pdf').disabled = flexCount === 0;
  $('btn-zpl').disabled = flexCount === 0;

  // Secciones por cuenta
  const container = $('accounts-container');
  container.innerHTML = '';

  for (const acct of d.accounts) {
    const section = document.createElement('div');
    section.className = 'acct-section';

    const acctFlexIds = (acct.orders || []).filter(o => o.is_flex && o.shipping_id).map(o => o.shipping_id);
    const acctFlexCount  = acctFlexIds.length;
    const acctCorreoCount = (acct.orders || []).filter(o => !o.is_flex).length;
    const acctUnits = (acct.orders || []).reduce((s,o) => s + o.items.reduce((a,i) => a+(i.quantity||0),0), 0);

    section.innerHTML = `
      <div class="acct-header">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="acct-avatar">${esc((acct.label||'?').trim().charAt(0).toUpperCase())}</div>
          <div class="min-w-0">
            <div class="acct-name truncate">${esc(acct.label || acct.accountId)}</div>
            <div class="acct-meta">${acct.ok ? `${acct.orders.length} órdenes · ${acctUnits} u. · ${acctFlexCount} flex · ${acctCorreoCount} correo` : `<span style="color:var(--re)">Error: ${esc(acct.error||'')}</span>`}</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0" class="btn-group">
          ${acctFlexCount ? `
            <button class="btn btn-primary" onclick="generarCuenta('${esc(acct.accountId)}','pdf')" style="height:30px;padding:0 12px;font-size:9px">
              ↓ PDF Flex (${acctFlexCount})
            </button>
            <button class="btn btn-zpl" onclick="generarCuenta('${esc(acct.accountId)}','zpl2')" style="height:30px;padding:0 12px;font-size:9px">
              🖨 ZPL (${acctFlexCount})
            </button>
          ` : ''}
        </div>
      </div>
      <div class="orders-list">
        ${renderOrders(acct)}
      </div>
    `;
    container.appendChild(section);
  }

  if (!d.totalOrders) {
    setStatus('✓ Nada para despachar en ninguna cuenta.');
  } else {
    const errCount = d.accounts.filter(a => !a.ok).length;
    setStatus(errCount ? `⚠ ${errCount} cuenta(s) con error · ${d.totalOrders} órdenes encontradas` : `${d.totalOrders} órdenes listas para despachar`);
  }
}

function renderOrders(acct) {
  if (!acct.ok) return `<div class="error-row">❌ ${esc(acct.error || 'Error al cargar')}</div>`;
  if (!acct.orders.length) return '<div class="empty-row">✓ Nada para despachar</div>';

  // Agregar por producto+variante dentro de la cuenta
  const agg = new Map();
  acct.orders.forEach(o => o.items.forEach(i => {
    const variant = (i.variation_attributes||[]).map(v => v.value_name||v.value_id||'').filter(Boolean).join(' · ');
    const key = i.title + '::' + variant + '::' + o.is_flex;
    if (!agg.has(key)) agg.set(key, { title:i.title, variant, picture:i.picture, qty:0, is_flex: o.is_flex });
    agg.get(key).qty += (i.quantity||0);
  }));

  return [...agg.values()].sort((a,b) => b.qty - a.qty).map(r => `
    <div class="order-row">
      ${r.picture
        ? `<img src="${esc(r.picture)}" alt="" class="item-img" loading="lazy"/>`
        : `<div class="item-img"></div>`}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
          <span class="${r.is_flex ? 'flex-badge' : 'correo-badge'}">${r.is_flex ? 'FLEX' : 'CORREO'}</span>
          <span class="item-title">${esc(r.title)}</span>
        </div>
        ${r.variant ? `<div class="item-variant">${esc(r.variant)}</div>` : ''}
      </div>
      <div style="flex-shrink:0">
        <span class="qty-badge">×${r.qty}</span>
      </div>
    </div>
  `).join('');
}

// ── carga de datos ──────────────────────────────────────────────
async function load() {
  $('btn-refresh').disabled = true;
  $('btn-pdf').disabled     = true;
  $('btn-zpl').disabled     = true;
  setStatus('Cargando pedidos de todas las cuentas…', true);
  try {
    const r = await fetch('/despachos-hoy-all');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    renderData(d);
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
  $('btn-refresh').disabled = false;
}

// ── generador de etiquetas ─────────────────────────────────────
async function generar(responseType) {
  const isPdf = responseType === 'pdf';
  const btnId = isPdf ? 'btn-pdf' : 'btn-zpl';
  $('btn-pdf').disabled = true;
  $('btn-zpl').disabled = true;
  setStatus(`Generando ${isPdf ? 'PDF' : 'ZPL'} de todas las cuentas…`, true);
  try {
    const r = await fetch(`/flex-pdf-all?responseType=${responseType}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    if (!d.total) { setStatus('Sin envíos Flex para generar etiquetas.'); return; }

    let ok = 0, failed = 0;
    for (const acct of d.accounts) {
      if (!acct.data_b64) { if (acct.error) failed++; continue; }
      descargarB64(acct.data_b64, isPdf ? 'application/pdf' : 'text/plain',
        `flex_${isPdf ? 'etiquetas' : 'zpl'}_${acct.accountId}_${new Date().toISOString().slice(0,10)}.${isPdf ? 'pdf' : 'zpl'}`);
      ok++;
    }
    const errs = d.accounts.filter(a => a.error).map(a => `${a.label}: ${a.error}`).join(' · ');
    setStatus(`✓ ${ok} archivo(s) descargados (${d.total} Flex)${failed ? ` · ⚠ ${failed} error(s): ${errs}` : ''}`);
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
  // Re-enable after render
  if (lastData) {
    const flexCount = lastData.accounts.flatMap(a => a.orders||[]).filter(o => o.is_flex).length;
    $('btn-pdf').disabled = flexCount === 0;
    $('btn-zpl').disabled = flexCount === 0;
  }
}

async function generarCuenta(accountId, responseType) {
  const isPdf = responseType === 'pdf';
  setStatus(`Generando ${isPdf ? 'PDF' : 'ZPL'} para ${accountId}…`, true);
  try {
    const r = await fetch(`/flex-pdf-all?responseType=${responseType}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error');
    const acct = d.accounts.find(a => a.accountId === accountId);
    if (!acct?.data_b64) { setStatus(acct?.error ? `❌ ${acct.error}` : 'Sin envíos Flex para esta cuenta.'); return; }
    descargarB64(acct.data_b64, isPdf ? 'application/pdf' : 'text/plain',
      `flex_${isPdf ? 'etiquetas' : 'zpl'}_${accountId}_${new Date().toISOString().slice(0,10)}.${isPdf ? 'pdf' : 'zpl'}`);
    setStatus(`✓ ${isPdf ? 'PDF' : 'ZPL'} de ${accountId} descargado (${acct.count} Flex)`);
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
}

function descargarB64(b64, mime, filename) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([arr], { type: mime }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ── auto-refresh cada 2 min ────────────────────────────────────
load();
setInterval(load, 120_000);
