<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Despachos — Stockroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=14">
<!-- Anti-FOUC -->
<script>(function(){ try { var t=localStorage.getItem('adminTheme')||'light'; document.documentElement.setAttribute('data-theme',t); } catch(e){} })();</script>
<style>

/* ── Page-specific styles (scoped to .pg) ── */
.pg { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; display: block; color: var(--text); }
.pg *, .pg *::before, .pg *::after { box-sizing: border-box; }

/* ── css vars (dark only for page components) ── */
.pg { --bg:var(--bg);--s1:var(--bg-card);--s2:var(--bg-card);--b1:var(--border);--b2:var(--border-2);--tx:var(--text);--t2:var(--text-2);--t3:var(--text-3);--ye:var(--blue);--cy:#3E7CB1;--re:var(--red);--or:var(--yellow);--gr:var(--green) }

/* ── spinner ── */
.pg .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--ye);border-radius:50%;animation:pg-spin .7s linear infinite}
@keyframes pg-spin{to{transform:rotate(360deg)}}

/* ── btn ── */
.pg .btn{height:36px;padding:0 16px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;border:1px solid var(--b1);background:var(--s2);color:var(--t2);cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px}
.pg .btn:hover{border-color:var(--b2);color:var(--tx)}
.pg .btn:disabled{opacity:.45;cursor:default}
.pg .btn-primary{background:var(--ye);color:#fff;border-color:var(--ye);font-weight:700}
.pg .btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color: var(--on-blue)}
.pg .btn-ghost{background:transparent;border-color:var(--b1);color:var(--t2)}
.pg .btn-zpl{background:#6366f1;border-color:#6366f1;color:#fff;font-weight:700}
.pg .btn-zpl:hover{background:#4f46e5;border-color:#4f46e5}
.pg #btn-refresh.is-loading #btn-refresh-icon{animation:pg-spin .7s linear infinite}

/* ── action bar ── */
.pg .action-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;background:var(--s1);border:1px solid var(--b1);border-radius:6px}
.pg .action-bar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pg .action-bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.pg #hdr-updated{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t3)}
.pg #hdr-sub{font-size:12px;color:var(--t2);font-family:'JetBrains Mono',monospace}

/* ── kpi pill ── */
.pg .kpi-pill{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:14px 20px;min-width:120px}

/* ── account section ── */
.pg .acct-section{background:var(--s1);border:1px solid var(--b1);border-radius:6px;overflow:hidden;margin-bottom:20px}
.pg .acct-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1);gap:12px;flex-wrap:wrap}
.pg .acct-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color: var(--on-blue);flex-shrink:0}
.pg .acct-name{font-size:13px;font-weight:600;color:var(--tx)}
.pg .acct-meta{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace}

/* ── order card ── */
.pg .order-row{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--b1);transition:background .12s}
.pg .order-row:last-child{border-bottom:none}
.pg .order-row:hover{background:rgba(255,255,255,.025)}
.pg .item-img{width:44px;height:44px;border-radius:6px;object-fit:cover;border:1px solid var(--b1);flex-shrink:0;background:var(--s2)}
.pg .item-title{font-size:12px;color:var(--tx);font-weight:500;line-height:1.4}
.pg .item-variant{font-size:11px;color:var(--t2);margin-top:2px}
.pg .qty-badge{height:24px;min-width:28px;padding:0 8px;background:color-mix(in srgb,var(--ye) 10%,transparent);border:1px solid color-mix(in srgb,var(--ye) 25%,transparent);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ye);display:inline-flex;align-items:center;justify-content:center}
.pg .flex-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--cy) 10%,transparent);border:1px solid color-mix(in srgb,var(--cy) 30%,transparent);color:var(--cy);letter-spacing:.06em;font-weight:600}
.pg .correo-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.05);border:1px solid var(--b2);color:var(--t2);letter-spacing:.06em}
.pg .agencia-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--or) 10%,transparent);border:1px solid color-mix(in srgb,var(--or) 35%,transparent);color:var(--or);letter-spacing:.06em;font-weight:600}
.pg .error-row{padding:16px 18px;color:var(--re);font-size:12px;font-family:'JetBrains Mono',monospace}
.pg .empty-row{padding:24px 18px;text-align:center;color:var(--t3);font-size:12px}

/* ── package view ── */
.pg .pkg-card{border-bottom:1px solid var(--b1)}
.pg .pkg-card:last-child{border-bottom:none}
.pg .prog-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--ye) 12%,transparent);border:1px solid color-mix(in srgb,var(--ye) 35%,transparent);color:var(--ye);letter-spacing:.05em;font-weight:700;white-space:nowrap}
.pg .prog-section .pkg-card{opacity:.72}
.pg .pkg-subhead.sh-prog{color:var(--ye);background:color-mix(in srgb,var(--ye) 6%,transparent)}
/* Venta multi-producto (pack): caja delimitada con margen, para que dos packs
   seguidos se vean como dos cajas separadas y no como un bloque continuo. */
.pg .pkg-card.pkg-multi{background:color-mix(in srgb,var(--ye) 2.5%,transparent);border:1px solid color-mix(in srgb,var(--ye) 28%,transparent);border-left:3px solid var(--ye);border-radius:6px;margin:10px;overflow:hidden}
.pg .pkg-card.pkg-multi + .pkg-card.pkg-multi{margin-top:10px}
.pg .pkg-header{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 5px;gap:8px;flex-wrap:wrap}
.pg .pkg-id{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t3);letter-spacing:.04em}
.pg .pkg-buyer{font-size:11px;color:var(--t2);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .pkg-multi-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--ye) 8%,transparent);border:1px solid color-mix(in srgb,var(--ye) 20%,transparent);color:var(--ye);letter-spacing:.06em;white-space:nowrap;flex-shrink:0}
.pg .pkg-single-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.04);border:1px solid var(--b1);color:var(--t3);letter-spacing:.06em;white-space:nowrap;flex-shrink:0}
/* Encabezado de subsección por tipo (Fundas / Mallas-Protectores / Combinadas) */
.pg .pkg-subhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 18px;font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t2);background:var(--bg);border-top:1px solid var(--b1);border-bottom:1px solid var(--b1)}
.pg .orders-list > .pkg-subhead:first-child{border-top:none}
.pg .pkg-subcount{font-size:10px;font-weight:700;color:var(--t3);background:var(--bg-card);border:1px solid var(--b1);border-radius:6px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.pg .pkg-subhead.sh-mixta{color:var(--or);box-shadow:inset 3px 0 0 var(--or)}
.pg .pkg-item{display:flex;align-items:flex-start;gap:12px;padding:7px 18px 7px 30px}
.pg .pkg-item:not(:last-child){border-bottom:1px solid rgba(255,255,255,.03)}
.pg .pkg-multi .pkg-item:not(:last-child){border-bottom:1px solid color-mix(in srgb,var(--ye) 5%,transparent)}

/* ── status bar ── */
.pg .status-bar{min-height:22px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2);margin-bottom:20px}

/* ── kpi row ── */
.pg .kpi-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}

/* ── btn group ── */
.pg .btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── LIGHTBOX ── */
.pg .lightbox-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .18s}
.pg .lightbox-ov.open{opacity:1;pointer-events:all}
.pg .lightbox-ov img{max-width:min(92vw,520px);max-height:80vh;border-radius:6px;border:1px solid var(--border);box-shadow:0 32px 80px rgba(0,0,0,.7);transform:scale(.92);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.pg .lightbox-ov.open img{transform:scale(1)}
.pg .item-img[src]{cursor:zoom-in;transition:opacity .15s}
.pg .item-img[src]:hover{opacity:.8}

/* ── Checkbox selección de órdenes ── */
.pg .ord-chk{width:15px;height:15px;cursor:pointer;accent-color:var(--ye);flex-shrink:0;margin-top:2px}
.pg .sel-btn{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:4px;border:1px solid var(--b2);background:transparent;color:var(--t3);cursor:pointer;letter-spacing:.04em;transition:all .12s}
.pg .sel-btn:hover{color:var(--tx);border-color:var(--b1)}

/* ── filtro por tipo ── */
.pg .tipo-filtro{display:flex;gap:8px;margin-bottom:16px}
.pg .tipo-filtro button{flex:1;height:38px;border:1px solid var(--b1);border-radius:8px;background:var(--bg-card);
  color:var(--t2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.pg .tipo-filtro button:hover{color:var(--tx);border-color:var(--b2)}
.pg .tipo-filtro button.on{background:var(--ye);border-color:var(--ye);color:#1a1a1a}
/* Filtrado por CSS: las combinadas quedan visibles en los dos filtros porque
   hay que prepararlas igual. Lo programado se oculta al filtrar. */
.pg[data-filtro="funda"] [data-tipo="malla"],
.pg[data-filtro="funda"] .prog-section,
.pg[data-filtro="malla"] [data-tipo="funda"],
.pg[data-filtro="malla"] .prog-section{display:none}

@media(max-width:640px){
  .pg .btn-group{flex-wrap:wrap}
  /* KPIs en grid de 3 columnas: 6 pills → 2 filas prolijas (antes flex:1 los
     comprimía a ~55px en una sola fila = ilegibles). */
  .pg .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pg .kpi-pill{min-width:0;padding:10px 12px;margin-left:0!important}
  .pg .action-bar{flex-direction:column;align-items:flex-start}

  /* ── Modo lista ──────────────────────────────────────────────
     En el celular esto se usa parado al lado de la mesa, con una mano y
     mirando de lejos: la pantalla tiene que ser la lista de pedidos, no un
     tablero. Los KPI y el encabezado se achican, los productos crecen. */
  /* KPIs en una sola tira compacta: antes ocupaban media pantalla y empujaban
     los pedidos abajo del fold. Acá son referencia, no protagonistas. */
  .pg .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .pg .kpi-pill{padding:6px 4px;text-align:center;min-width:0}
  .pg .kpi-pill > div:first-child{font-size:9px!important;letter-spacing:.04em}
  .pg .kpi-pill > div:last-child{font-size:1.05rem!important;line-height:1.2}
  /* "Actualizado" ya está en el encabezado */
  .pg .kpi-pill:nth-child(5){display:none}

  /* Botones en una fila que se desliza, en vez de dos filas apiladas */
  .pg .action-bar{gap:8px}
  .pg .btn-group{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;
    scrollbar-width:none}
  .pg .btn-group::-webkit-scrollbar{display:none}
  .pg .btn-group .btn{flex:0 0 auto;font-size:12px;padding:0 10px;height:34px}
  .pg .hdr-sub{font-size:11px}
  .pg .acct-header{padding:10px 12px}
  .pg .status-bar{margin-bottom:12px}

  /* La botonera se queda fija arriba: se filtra todo el tiempo */
  .pg .tipo-filtro{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:8px 0;margin:0 0 12px}
  .pg .tipo-filtro button{height:40px;font-size:13px}

  /* Producto: mas grande que en PC pero con una escala pareja. La version
     anterior saltaba de 10px a 16px y se veia desbalanceada; acá todo el
     texto vive entre 11 y 13.5px, y entran mas productos por pantalla. */
  .pg .pkg-item{gap:11px;padding:9px 12px 9px 14px;align-items:center}
  .pg .item-img{width:52px;height:52px;border-radius:7px}
  .pg .item-title{font-size:13px;line-height:1.35;font-weight:500}
  .pg .item-variant{font-size:12px;margin-top:2px}
  .pg .qty-badge{height:28px;min-width:36px;font-size:13px;font-weight:700;border-radius:7px}

  /* Cabecera de cada venta: compacta, es dato secundario */
  .pg .pkg-header{padding:7px 12px 3px;gap:6px}
  .pg .pkg-id,.pg .pkg-buyer{font-size:11px}
  .pg .pkg-multi-badge,.pg .pkg-single-badge{font-size:10px}
  .pg .pkg-subhead{padding:9px 12px;font-size:10px}
  .pg .pkg-card.pkg-multi{margin:8px 6px}
  .pg .ord-chk{width:19px;height:19px}
}

</style>
<script src="/pdf-lib.min.js"></script>
</head>
<body>
<div class="adm-wrap">

<!-- ═══════════════════════════ SIDEBAR ════════════════════════ -->
<aside class="adm-sidebar" id="sidebar"></aside>
<script src="/stockroom-sidebar.js?v=9"></script>

<!-- ══════════════════════════ MAIN ════════════════════════ -->
<div class="adm-main">

  <!-- HEADER -->
  <header class="adm-header">
    <div class="adm-header-left">
      <button class="adm-hamburger" id="btn-hamburger" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <div class="adm-page-title">Despachos</div>
        <div class="adm-page-sub">
          <span id="h-subtitle">Pendientes de hoy</span>
        </div>
      </div>
    </div>
    <div class="adm-header-right">
      <!-- Theme toggle -->
      <button class="adm-theme-btn" id="btn-theme" title="Cambiar tema" aria-label="Cambiar tema">
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun"  width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>

      <!-- Account switcher -->
      <div class="adm-acct" id="acct-wrap">
        <button class="adm-acct-btn" id="acc-btn">
          <div class="adm-avatar" id="acc-initial">?</div>
          <span class="adm-acct-name" id="acc-label">Cuenta</span>
          <svg class="adm-acct-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="adm-dropdown hidden" id="acc-panel">
          <div class="adm-dropdown-head">Cuenta activa</div>
          <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
            <div style="font-size:13px;font-weight:600;color:var(--text)" id="acc-active">—</div>
            <div style="font-size:11px;color:var(--text-3);font-family:var(--font-mono);margin-top:2px" id="acc-active-id">—</div>
          </div>
          <div id="acc-list"></div>
          <div class="adm-dropdown-foot">
            <a href="/oauth/start" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center">+ Nueva cuenta</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="adm-content">
    <div class="pg">

  <!-- Action bar (replaces old header buttons) -->
  <div class="action-bar">
    <div class="action-bar-left">
      <span id="hdr-sub" class="hdr-sub">Todas las cuentas · pedidos para despachar hoy</span>
      <span id="hdr-updated"></span>
    </div>
    <div class="action-bar-right btn-group">
      <button onclick="load()" class="btn btn-ghost" id="btn-refresh" title="Actualizar">
        <svg id="btn-refresh-icon" viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        Actualizar
      </button>
      <button onclick="generarSeleccionadas()" class="btn btn-primary" id="btn-sel-pdf" disabled style="display:none">
        ↓ Flex seleccionadas
      </button>
      <button onclick="generar('pdf')" class="btn btn-primary" id="btn-pdf" disabled>
        ↓ PDF Flex · todas
      </button>
      <button onclick="generar('zpl2')" class="btn btn-zpl" id="btn-zpl" disabled>
        ↓ Etiquetas · todas
      </button>
      <button onclick="imprimirFlyer()" class="btn btn-ghost" id="btn-flyer" title="Imprimir flyer con QR + cupón para meter en los paquetes">
        🖨 Flyer
      </button>
    </div>
  </div>

  <!-- KPI row -->
  <div class="kpi-row">
    <div class="kpi-pill">
      <div style="font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:4px">Paquetes</div>
      <div style="font-size:1.5rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--tx)" id="kpi-orders">—</div>
    </div>
    <div class="kpi-pill">
      <div style="font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:4px">Unidades</div>
      <div style="font-size:1.5rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--tx)" id="kpi-units">—</div>
    </div>
    <div class="kpi-pill">
      <div style="font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:4px">Flex</div>
      <div style="font-size:1.5rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--cy)" id="kpi-flex">—</div>
    </div>
    <div class="kpi-pill">
      <div style="font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:4px">Agencia</div>
      <div style="font-size:1.5rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--or)" id="kpi-agencia">—</div>
    </div>
  </div>

  <!-- Filtro por tipo. Arriba de todo porque en el celular es lo primero que
       se toca: se prepara una tanda de fundas o una de mallas, no las dos. -->
  <div class="tipo-filtro" id="tipo-filtro" data-arranque="funda">
    <button data-f="funda" class="on" onclick="filtrarTipo('funda')">Fundas</button>
    <button data-f="malla"        onclick="filtrarTipo('malla')">Mallas</button>

const $I = id => document.getElementById(id);
const $ = sel => document.querySelectorAll(sel);

// 'YYYY-MM-DD' → 'vie 10/7' (día de despacho programado)
const fmtDispatchDay = ymd => {
  if (!ymd) return '';
  const [y,m,dd] = ymd.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  if (isNaN(dt)) return ymd;
  return `${dt.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','')} ${dd}/${m}`;
};

/* Clock */
(function clock(){

})();

// ── render ─────────────────────────────────────────────────────
function renderData(d, ts) {
  lastData = d;

  const allOrders = d.accounts.flatMap(a => (a.orders||[]).map(o => ({ ...o, _acct: a.accountId })));
  // Las ventas PROGRAMADAS (a futuro) se deseleccionan una sola vez, para que
  // "imprimir/despachar todo" no las agarre. Si el usuario las selecciona a
  // mano, no se vuelven a tocar en refrescos posteriores.
  allOrders.forEach(o => {
    if (o.scheduled && !autoDeselProg.has(String(o.id))) {
      autoDeselProg.add(String(o.id));
      deselectedOrders.add(String(o.id));
    }
  });
  // KPIs globales → cuentan solo lo de HOY (lo accionable)
  const hoyOrders = allOrders.filter(o => !o.scheduled);
  // Se cuenta por PAQUETE, no por orden de ML. Una compra de varios productos
  // llega como varias órdenes con el mismo pack_id pero es UN solo envío: por
  // contar órdenes crudas el panel marcaba 26 donde había 10 paquetes, y
  // flex+agencia sumaban 26 en vez de 10.
  const packKey  = o => o.pack_id || ('o_' + o.id);
  const paquetes = new Set(hoyOrders.map(packKey));
  $I('kpi-orders').textContent = paquetes.size;
  $I('kpi-units').textContent  = hoyOrders.reduce((s,o) => s + (o.items||[]).reduce((a,i) => a + (i.quantity||1), 0), 0);
  // Un pack comparte un único envío, así que su tipo no puede estar dividido
  const flexCount    = new Set(hoyOrders.filter(o =>  o.is_flex).map(packKey)).size;
  const agenciaCount = new Set(hoyOrders.filter(o => !o.is_flex).map(packKey)).size;
  $I('kpi-flex').textContent    = flexCount;
  $I('kpi-agencia').textContent = agenciaCount;
  const timeStr = ts ? new Date(ts).toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }) : fmtNow();
  $I('hdr-updated').textContent = 'Última carga: ' + timeStr;

  // Botones globales
  $I('btn-pdf').disabled = flexCount === 0;
  $I('btn-zpl').disabled = hoyOrders.length === 0;

  // Secciones por cuenta
  const container = $I('accounts-container');
  container.innerHTML = '';

  for (const acct of d.accounts) {
    const section = document.createElement('div');
    section.className = 'acct-section';

    const acctOrders = acct.orders || [];
    // Dedup por shipping_id: un pack (varias órdenes, mismo envío) = 1 etiqueta Flex.
    const acctFlexIds    = [...new Set(acctOrders.filter(o => o.is_flex && o.shipping_id).map(o => o.shipping_id))];
    const acctFlexCount  = acctFlexIds.length;
    const acctNonFlex    = acctOrders.filter(o => !o.is_flex).length;
    const acctUnits      = acctOrders.reduce((s,o) => s + o.items.reduce((a,i) => a+(i.quantity||0),0), 0);
    const dispType       = getDispatchType(acct.accountId);
    const metaParts = [];
    if (acctOrders.length) metaParts.push(`${acctOrders.length} órdenes · ${acctUnits} u.`);
    if (acctFlexCount) metaParts.push(`${acctFlexCount} flex`);
    if (acctNonFlex)   metaParts.push(`${acctNonFlex} ${dispType}`);

    section.innerHTML = `
      <div class="acct-header">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <div class="acct-avatar">${esc((acct.label||'?').trim().charAt(0).toUpperCase())}</div>
          <div style="min-width:0">
            <div class="acct-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(acct.label || acct.accountId)}</div>
            <div class="acct-meta">${acct.ok ? metaParts.join(' · ') : `<span style="color:var(--re)">Error: ${esc(acct.error||'')}</span>`}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0" class="btn-group">
          <button class="sel-btn" onclick="selectAll('${esc(acct.accountId)}')">SEL ✓</button>
          <button class="sel-btn" onclick="deselectAll('${esc(acct.accountId)}')">DESEL ✗</button>
          ${acctFlexCount ? `
            <button class="btn btn-primary" onclick="generarCuenta('${esc(acct.accountId)}','pdf')" style="height:30px;padding:0 12px;font-size:9px">
              ↓ PDF Flex (${acctFlexCount})
            </button>
          ` : ''}
          ${acctOrders.length ? `
            <button class="btn btn-zpl" onclick="generarCuenta('${esc(acct.accountId)}','zpl2')" style="height:30px;padding:0 12px;font-size:9px">
              ↓ Etiquetas (${acctOrders.length})
            </button>
          ` : ''}
        </div>
      </div>
      <div class="orders-list">
        ${renderOrders(acct)}
      </div>
    `;
    container.appendChild(section);
  }

  if (!d.totalOrders) {
    setStatus('✓ Nada para despachar en ninguna cuenta.');
  } else {
    const errCount = d.accounts.filter(a => !a.ok).length;
    setStatus(errCount ? `⚠ ${errCount} cuenta(s) con error · ${d.totalOrders} órdenes encontradas` : `${d.totalOrders} órdenes listas para despachar`);
  }
}

// ── Preferencia de despacho por cuenta (persiste en localStorage) ──
// Ambas cuentas usan Agencia — el correo ya no se usa (se sacó el toggle/pill).
// Se deja la función para no tocar sus llamadores; siempre devuelve 'agencia'.
function getDispatchType(accountId) { return 'agencia'; }

function renderOrders(acct) {
  if (!acct.ok) return `<div class="error-row">❌ ${esc(acct.error || 'Error al cargar')}</div>`;
  if (!acct.orders.length) return '<div class="empty-row">✓ Nada para despachar</div>';

  const dispatchType = getDispatchType(acct.accountId);

  const BADGE = {
    flex:    ['flex-badge',    'FLEX'],
    agencia: ['agencia-badge', 'AGENCIA'],
    correo:  ['correo-badge',  'CORREO'],
  };

  // Agrupar por pack_id: varias órdenes con el mismo pack_id = UNA compra de
  // varios productos (ML la parte en órdenes separadas que comparten envío). Sin
  // pack (o pack único) = venta de un solo producto. Así una compra de 2
  // productos se ve como UNA venta y no como dos ventas sueltas.
  const groups = [];
  const byKey = {};
  for (const o of acct.orders) {
    const key = o.pack_id || ('o_' + o.id);
    if (!byKey[key]) { byKey[key] = { orders: [] }; groups.push(byKey[key]); }
    byKey[key].orders.push(o);
  }

  const renderCard = (g, tipoGrupo = 'mixta') => {
    const orders    = g.orders;
    const o0        = orders[0];
    const orderIds  = orders.map(o => String(o.id));
    const items     = orders.flatMap(o => o.items);    // todos los productos de la venta
    const prodLines = items.length;                    // cantidad de productos distintos
    const totalUnits = items.reduce((s, i) => s + (i.quantity || 1), 0);
    const isMulti   = prodLines > 1;                   // venta de más de un producto

    const tipo = o0.is_flex ? 'flex' : dispatchType;
    const [cls, label] = BADGE[tipo] || BADGE.correo;
    const buyer = o0.buyer && o0.buyer !== '—' ? o0.buyer : '';

    const itemsHtml = items.map(i => {
      const variant = (i.variation_attributes||[]).map(v => v.value_name||v.value_id||'').filter(Boolean).join(' · ');
      return `
      <div class="pkg-item">
        ${i.picture
          ? `<img src="${esc(i.picture)}" alt="Foto del producto — ampliar" class="item-img" loading="lazy" role="button" tabindex="0" onkeydown="teclaActiva(event,this)" onclick="openImg(this.src)"/>`
          : `<div class="item-img"></div>`}
        <div style="flex:1;min-width:0">
          <div class="item-title">${esc(i.title)}</div>
          ${variant ? `<div class="item-variant">${esc(variant)}</div>` : ''}
        </div>
        <span class="qty-badge">×${i.quantity || 1}</span>
      </div>`;
    }).join('');

    const idsAttr = orderIds.join(',');
    const sel = orderIds.every(id => isOrderSelected(id));
    const progBadge = o0.scheduled
      ? `<span class="prog-badge">🗓 despachar ${esc(fmtDispatchDay(o0.handling_date))}</span>`
      : '';
    // Badge claro de la composición de la venta (lo que pidió el usuario).
    const ventaBadge = isMulti
      ? `<span class="pkg-multi-badge">📦 Venta de ${prodLines} productos</span>`
      : (totalUnits > 1
          ? `<span class="pkg-multi-badge">📦 1 producto ×${totalUnits}</span>`
          : `<span class="pkg-single-badge">1 producto</span>`);
    // # de orden(es): si es un pack, mostrar todas las que lo componen.
    const ordChips = orders.length > 1
      ? orders.map(o => '#' + String(o.id).slice(-6)).join(' + ')
      : '#' + String(o0.id || '').slice(-6);

    return `
    <div class="pkg-card${isMulti ? ' pkg-multi' : ''}" data-tipo="${tipoGrupo}">
      <div class="pkg-header">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <input type="checkbox" class="ord-chk" data-order-ids="${esc(idsAttr)}"
            ${sel ? 'checked' : ''}
            onclick="togglePackSel('${esc(idsAttr)}')"
          />
          <span class="${cls}">${label}</span>
          ${progBadge}
          <span class="pkg-id">${esc(ordChips)}</span>
          ${buyer ? `<span class="pkg-buyer">${esc(buyer)}</span>` : ''}
        </div>
        ${ventaBadge}
      </div>
      ${itemsHtml}
    </div>`;
  };

  // ── Separar por tipo: Fundas vs Mallas/Protectores ──────────────
  // Clasifica cada VENTA (no cada ítem). Una venta que mezcla fundas con
  // mallas/protectores va a "Combinadas" para no duplicarla ni esconderla:
  // así se despacha contemplando que tiene de ambas.
  // Separar las ventas PROGRAMADAS (se despachan a futuro) de las de hoy, para
  // que no se mezclen con lo que hay que preparar ya.
  const hoyGroups  = groups.filter(g => !g.orders[0].scheduled);
  const progGroups = groups.filter(g =>  g.orders[0].scheduled);

  // Fundas incluye sopapas/soportes de celular: se preparan y despachan junto
  // con las fundas. Todo lo demas (mallas, protectores, correas) es "mallas".
  const esFunda = t => /funda|carcasa|cover|sopapa/i.test(t || '');
  const buckets = { malla: [], funda: [], mixta: [] };
  for (const g of hoyGroups) {
    const titles = g.orders.flatMap(o => o.items).map(i => i.title || '');
    const hasFunda = titles.some(esFunda);
    const hasOtro  = titles.some(t => !esFunda(t));
    buckets[(hasFunda && hasOtro) ? 'mixta' : hasFunda ? 'funda' : 'malla'].push(g);
  }
  // data-tipo permite filtrar por CSS: las combinadas llevan las dos marcas
  // porque hay que prepararlas tanto si estas armando fundas como mallas.
  const sub = (label, arr, cls, tipo) => arr.length
    ? `<div class="pkg-subhead ${cls}" data-tipo="${tipo}"><span>${label}</span><span class="pkg-subcount">${arr.length}</span></div>`
      + arr.map(g => renderCard(g, tipo)).join('')
    : '';
  let html = sub('Mallas / Protectores', buckets.malla, 'sh-malla', 'malla')
           + sub('Fundas', buckets.funda, 'sh-funda', 'funda')
           + sub('Combinadas · fundas + mallas/protectores', buckets.mixta, 'sh-mixta', 'mixta');
  if (!html) html = '<div class="empty-row">✓ Nada para despachar hoy</div>';

  if (progGroups.length) {
    html += `<div class="prog-section">`
          + `<div class="pkg-subhead sh-prog"><span>Programado · a despachar a futuro</span><span class="pkg-subcount">${progGroups.length}</span></div>`
          + progGroups.map(g => renderCard(g, 'prog')).join('')
          + `</div>`;
  }
  return html;
}

/* ── Filtro por tipo ───────────────────────────────────────────
   Se filtra con un atributo en el contenedor y reglas CSS, sin volver a pedir
   datos ni re-renderizar: el toque responde al instante y no se pierde la
   seleccion de ordenes que ya venias marcando. */
let filtroTipo = 'funda';   // arranca en fundas: es el grueso del despacho
function filtrarTipo(t) {
  filtroTipo = t;
  const pg = document.querySelector('.pg');
  if (t === 'todo') pg.removeAttribute('data-filtro');
  else pg.setAttribute('data-filtro', t);
  document.querySelectorAll('#tipo-filtro button').forEach(b =>
    b.classList.toggle('on', b.dataset.f === t));
  try { localStorage.setItem('dsp_filtro', t); } catch (e) {}
  actualizarConteoFiltro();
}

/* Cuántas ventas quedan a la vista: sin esto, al filtrar no se sabe si no hay
   nada de ese tipo o si algo falló. */
function actualizarConteoFiltro() {
  const vis = [...document.querySelectorAll('.pkg-card')]
    .filter(c => c.offsetParent !== null).length;
  const bar = document.getElementById('status-bar');
  if (!bar || !bar.dataset.base) return;
  bar.innerHTML = filtroTipo === 'todo'
    ? bar.dataset.base
    : `${bar.dataset.base} · <b>${vis}</b> ${filtroTipo === 'funda' ? 'con fundas' : 'con mallas/protectores'}`;

  // Si el filtro esconde todo, decirlo. Una lista en blanco parece un error de
  // carga y manda a refrescar al pedo.
  document.querySelectorAll('.filtro-vacio').forEach(e => e.remove());
  if (filtroTipo !== 'todo' && vis === 0 && document.querySelector('.pkg-card')) {
    const cont = document.getElementById('accounts-container');
    const tipo = filtroTipo === 'funda' ? 'fundas' : 'mallas o protectores';
    const div = document.createElement('div');
    div.className = 'empty-row filtro-vacio';
    div.innerHTML = `No hay pedidos con ${tipo} para despachar.
      <button class="sel-btn" style="margin-left:8px" onclick="filtrarTipo('todo')">Ver todos</button>`;
    cont.appendChild(div);
  }
}

// Se recuerda el ultimo filtro usado; si no hay nada guardado arranca en
// Fundas, que es el grueso de lo que se despacha.
function aplicarFiltroInicial() {
  let inicial = 'funda';
  try { inicial = localStorage.getItem('dsp_filtro') || 'funda'; } catch (e) {}
  filtrarTipo(inicial);
}

// ── Selección de órdenes ──────────────────────────────────────
const deselectedOrders = new Set(); // IDs de órdenes deseleccionadas
const autoDeselProg    = new Set(); // IDs de programadas ya auto-deseleccionadas (una vez)

function isOrderSelected(orderId) {
  return !deselectedOrders.has(String(orderId));
}
function toggleOrder(orderId) {
  const id = String(orderId);
  if (deselectedOrders.has(id)) deselectedOrders.delete(id);
  else deselectedOrders.add(id);
  updateSelectionUI();
}
// Una venta puede agrupar varias órdenes (pack). El checkbox de la card las
// toca todas juntas: si están todas seleccionadas → deselecciona todas, si no
// → selecciona todas.
function togglePackSel(idsCsv) {
  const ids = String(idsCsv).split(',').filter(Boolean);
  const allSel = ids.every(id => isOrderSelected(id));
  ids.forEach(id => { if (allSel) deselectedOrders.add(id); else deselectedOrders.delete(id); });
  updateSelectionUI();
}
function selectAll(accountId) {
  if (!lastData) return;
  const acct = lastData.accounts.find(a => a.accountId === accountId);
  if (!acct) return;
  // SEL ✓ selecciona solo lo de HOY; las programadas se dejan como están.
  (acct.orders||[]).forEach(o => { if (!o.scheduled) deselectedOrders.delete(String(o.id)); });
  updateSelectionUI();
}
function deselectAll(accountId) {
  if (!lastData) return;
  const acct = lastData.accounts.find(a => a.accountId === accountId);
  if (!acct) return;
  (acct.orders||[]).forEach(o => deselectedOrders.add(String(o.id)));
  updateSelectionUI();
}
function updateSelectionUI() {
  if (!lastData) return;
  const allOrders = lastData.accounts.flatMap(a => a.orders||[]);
  const selFlex   = allOrders.filter(o => o.is_flex && isOrderSelected(o.id));
  const selAll    = allOrders.filter(o => isOrderSelected(o.id));
  const totalFlex = allOrders.filter(o => o.is_flex).length;
  const totalAll  = allOrders.length;
  const isPartial = deselectedOrders.size > 0;

  // Botón "todas"
  const btnPdf = $I('btn-pdf');
  const btnZpl = $I('btn-zpl');
  if (btnPdf) { btnPdf.disabled = totalFlex === 0; btnPdf.textContent = '↓ PDF Flex · todas'; }
  if (btnZpl) { btnZpl.disabled = totalAll === 0;  btnZpl.textContent = '↓ Etiquetas · todas'; }

  // Botón "seleccionadas" — solo visible cuando hay selección parcial
  const btnSel = $I('btn-sel-pdf');
  if (btnSel) {
    const hasSel = selFlex.length > 0 && isPartial;
    btnSel.style.display = hasSel ? '' : 'none';
    btnSel.disabled = !hasSel;
    if (hasSel) btnSel.textContent = `↓ Flex sel. (${selFlex.length})`;
  }

  // Actualizar checkboxes visibles (cada uno puede agrupar varias órdenes/pack)
  document.querySelectorAll('.ord-chk').forEach(chk => {
    const ids = (chk.dataset.orderIds || '').split(',').filter(Boolean);
    chk.checked = ids.length > 0 && ids.every(id => isOrderSelected(id));
  });
}

// ── caché local ───────────────────────────────────────────────
const CACHE_KEY = 'stockroom_despachos_v1';
function saveCache(d) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ d, ts: new Date().toISOString() })); } catch(e) {}
}
function loadFromCache() {
  try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; }
}

// ── carga de datos ──────────────────────────────────────────────
async function load() {
  const btn = $I('btn-refresh');
  btn.disabled = true;
  btn.classList.add('is-loading');
  $I('btn-pdf').disabled = true;
  $I('btn-zpl').disabled = true;
  try {
    const r = await fetch('/despachos-hoy-all');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    saveCache(d);
    renderData(d, new Date().toISOString());
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('is-loading');
    if (lastData) {
      const allOrd   = lastData.accounts.flatMap(a => a.orders||[]);
      const flexCount = allOrd.filter(o => o.is_flex).length;
      $I('btn-pdf').disabled = flexCount === 0;
      $I('btn-zpl').disabled = allOrd.length === 0;
    }
  }
}

// Al abrir la página: mostrar caché si existe, sin llamar a la API
(function initFromCache() {
  const cached = loadFromCache();
  if (cached) {
    renderData(cached.d, cached.ts);
  } else {
    setStatus('Presioná Actualizar para cargar los pedidos.');
  }
})();

// ── Descargar Flex seleccionadas (con merge si hay múltiples cuentas) ──────
async function generarSeleccionadas() {
  if (!lastData) return;
  // Recopilar flex seleccionados con su cuenta
  const selFlex = lastData.accounts.flatMap(a =>
    (a.orders||[])
      .filter(o => o.is_flex && o.shipping_id && isOrderSelected(o.id))
      .map(o => ({ shippingId: o.shipping_id, accountId: a.accountId }))
  );
  if (!selFlex.length) { setStatus('No hay envíos Flex seleccionados.'); return; }

  // Dedup: un pack son varias órdenes con el MISMO shipping_id → una sola etiqueta.
  const shippingIds = [...new Set(selFlex.map(o => o.shippingId))].join(',');
  const cuentas = [...new Set(selFlex.map(o => o.accountId))];
  const multiCuenta = cuentas.length > 1;

  [$I('btn-sel-pdf'), $I('btn-pdf'), $I('btn-zpl')].forEach(b => b && (b.disabled = true));
  setStatus(`Generando PDF de ${selFlex.length} Flex seleccionado(s)…`, true);

  try {
    const r = await fetch(`/flex-pdf-all?responseType=pdf&shipping_ids=${shippingIds}`);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    const acctOk = (d.accounts||[]).filter(a => a.data_b64);
    if (!acctOk.length) throw new Error('Sin datos PDF en la respuesta');

    if (!multiCuenta || acctOk.length === 1) {
      // Una sola cuenta — descarga directa
      descargarB64(acctOk[0].data_b64, 'application/pdf',
        `flex_${acctOk[0].accountId}_sel_${new Date().toISOString().slice(0,10)}.pdf`);
      setStatus(`✓ PDF descargado (${selFlex.length} Flex seleccionados)`);
    } else {
      // Múltiples cuentas — merge con pdf-lib
      if (!window.PDFLib) throw new Error('pdf-lib no disponible (recargá la página)');
      setStatus('Uniendo PDFs de ' + acctOk.length + ' cuentas…', true);
      const { PDFDocument } = window.PDFLib;
      const merged = await PDFDocument.create();
      for (const acct of acctOk) {
        try {
          const bytes = Uint8Array.from(atob(acct.data_b64), c => c.charCodeAt(0));
          const src   = await PDFDocument.load(bytes, { ignoreEncryption: true });
          const pages = await merged.copyPages(src, src.getPageIndices());
          pages.forEach(p => merged.addPage(p));
        } catch(e) { console.warn('merge:', acct.accountId, e); }
      }
      const blob = new Blob([await merged.save()], { type: 'application/pdf' });
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(blob),
        download: `flex_seleccionadas_${new Date().toISOString().slice(0,10)}.pdf`
      });
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setStatus(`✓ PDF unificado — ${selFlex.length} Flex de ${acctOk.length} cuentas`);
    }
  } catch(e) {
    setStatus('❌ ' + e.message);
  } finally {
    if (lastData) {
      const allOrd = lastData.accounts.flatMap(a => a.orders||[]);
      $I('btn-pdf').disabled = allOrd.filter(o => o.is_flex).length === 0;
      $I('btn-zpl').disabled = allOrd.length === 0;
      updateSelectionUI();
    }
  }
}

// ── generador de etiquetas ─────────────────────────────────────
async function generar(responseType) {
  const isPdf = responseType === 'pdf';
  const allOrd = lastData ? lastData.accounts.flatMap(a => a.orders||[]) : [];
  // Solo filtrar si hay órdenes deseleccionadas (parcial), de lo contrario no pasar filtro
  const hasDesel = deselectedOrders.size > 0;
  const selIds  = hasDesel ? allOrd.filter(o => isOrderSelected(o.id)) : allOrd;
  // Dedup por shipping_id: un pack son varias órdenes con el mismo envío → 1 etiqueta.
  const selFlex = hasDesel ? [...new Set(selIds.filter(o => o.is_flex && o.shipping_id).map(o => String(o.shipping_id)))].join(',') : '';
  const selShip = hasDesel ? [...new Set(selIds.filter(o => o.shipping_id).map(o => String(o.shipping_id)))].join(',') : '';
  const qs = isPdf ? (selFlex ? `&shipping_ids=${selFlex}` : '') : (selShip ? `&shipping_ids=${selShip}` : '');
  const endpoint = isPdf ? `/flex-pdf-all?responseType=${responseType}${qs}` : `/etiquetas-all?responseType=${responseType}${qs}`;
  $I('btn-pdf').disabled = true;
  $I('btn-zpl').disabled = true;
  setStatus(`Generando ${isPdf ? 'PDF Flex' : 'etiquetas'} de todas las cuentas…`, true);
  try {
    const r = await fetch(endpoint);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error del servidor');
    if (!d.total) { setStatus(isPdf ? 'Sin envíos Flex para generar PDF.' : 'Sin órdenes para generar etiquetas.'); return; }

    const acctOk = d.accounts.filter(a => a.data_b64);
    const failed = d.accounts.filter(a => a.error).length;
    const errs   = d.accounts.filter(a => a.error).map(a => `${a.label}: ${a.error}`).join(' · ');

    if (isPdf) {
      const libOk = !!window.PDFLib;
      if (!libOk) {
        // pdf-lib no cargó — descarga separada como fallback
        setStatus('⚠ pdf-lib no disponible, descargando por separado…', true);
        for (const acct of acctOk) {
          descargarB64(acct.data_b64, 'application/pdf',
            `flex_${acct.accountId}_${new Date().toISOString().slice(0,10)}.pdf`);
        }
        setStatus(`✓ ${acctOk.length} PDF(s) descargados (sin merge — pdf-lib no cargó)${failed ? ` · ⚠ ${errs}` : ''}`);
      } else {
        // Merge todos los PDFs en uno solo
        setStatus('Uniendo PDFs…', true);
        const { PDFDocument } = window.PDFLib;
        const merged = await PDFDocument.create();
        for (const acct of acctOk) {
          try {
            const bytes = Uint8Array.from(atob(acct.data_b64), c => c.charCodeAt(0));
            const srcPdf = await PDFDocument.load(bytes, { ignoreEncryption: true });
            const pages  = await merged.copyPages(srcPdf, srcPdf.getPageIndices());
            pages.forEach(p => merged.addPage(p));
          } catch(e) { console.warn('merge error', acct.accountId, e); }
        }
        const mergedBytes = await merged.save();
        const blob = new Blob([mergedBytes], { type: 'application/pdf' });
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(blob),
          download: `flex_todas_${new Date().toISOString().slice(0,10)}.pdf`
        });
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        setStatus(`✓ PDF unificado descargado (${d.total} Flex · ${acctOk.length} cuentas)${failed ? ` · ⚠ ${errs}` : ''}`);
      }
    } else {
      // ZPL / zip — descarga por cuenta
      let ok = 0;
      for (const acct of acctOk) {
        descargarB64(acct.data_b64, 'application/zip',
          `etiquetas_${acct.accountId}_${new Date().toISOString().slice(0,10)}.zip`);
        ok++;
      }
      setStatus(`✓ ${ok} archivo(s) descargados (${d.total} órdenes)${failed ? ` · ⚠ ${errs}` : ''}`);
    }
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
  if (lastData) {
    const allOrd = lastData.accounts.flatMap(a => a.orders||[]);
    const flexCount = allOrd.filter(o => o.is_flex).length;
    $I('btn-pdf').disabled = flexCount === 0;
    $I('btn-zpl').disabled = allOrd.length === 0;
  }
}

async function generarCuenta(accountId, responseType) {
  const isPdf = responseType === 'pdf';
  const acctData = lastData ? lastData.accounts.find(a => a.accountId === accountId) : null;
  const allAcctOrds = acctData ? (acctData.orders||[]) : [];
  const hasDesel = deselectedOrders.size > 0;
  const acctOrds = hasDesel ? allAcctOrds.filter(o => isOrderSelected(o.id)) : allAcctOrds;
  // Dedup por shipping_id: un pack son varias órdenes con el mismo envío → 1 etiqueta.
  const selFlex = hasDesel ? [...new Set(acctOrds.filter(o => o.is_flex && o.shipping_id).map(o => String(o.shipping_id)))].join(',') : '';
  const selShip = hasDesel ? [...new Set(acctOrds.filter(o => o.shipping_id).map(o => String(o.shipping_id)))].join(',') : '';
  const qs = isPdf ? (selFlex ? `&shipping_ids=${selFlex}` : '') : (selShip ? `&shipping_ids=${selShip}` : '');
  const endpoint = isPdf ? `/flex-pdf-all?responseType=${responseType}${qs}` : `/etiquetas-all?responseType=${responseType}${qs}`;
  setStatus(`Generando ${isPdf ? 'PDF Flex' : 'etiquetas'} para ${accountId}…`, true);
  try {
    const r = await fetch(endpoint);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error');
    const acct = d.accounts.find(a => a.accountId === accountId);
    if (!acct?.data_b64) { setStatus(acct?.error ? `❌ ${acct.error}` : isPdf ? 'Sin envíos Flex para esta cuenta.' : 'Sin órdenes para esta cuenta.'); return; }
    descargarB64(acct.data_b64, isPdf ? 'application/pdf' : 'application/zip',
      `${isPdf ? 'flex' : 'etiquetas'}_${accountId}_${new Date().toISOString().slice(0,10)}.${isPdf ? 'pdf' : 'zip'}`);
    setStatus(`✓ ${isPdf ? 'PDF Flex' : 'Etiquetas'} de ${accountId} descargado (${acct.count} ${isPdf ? 'Flex' : 'órdenes'})`);
  } catch(e) {
    setStatus('❌ Error: ' + e.message);
  }
}

function descargarB64(b64, mime, filename) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([arr], { type: mime }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function openImg(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = src;
  lb.classList.add('open');
}
function closeImg() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImg(); });
